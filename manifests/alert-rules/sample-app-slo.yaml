# Simplified single-window burn-rate alert — NOT the full Google SRE workbook multi-window
# multi-burn-rate approach (which trades a second, longer-window query for better precision/
# recall balance). Documented simplification, appropriate for a demo app's SLO; a real
# production SLO would add a long-window (e.g. 1h) confirmation query alongside this one.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sample-app-slo
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: sample-app-slo
      rules:
        - record: sampleapp:http_requests:error_rate5m
          expr: |
            sum(rate(http_server_request_duration_seconds_count{job="observability-sample-app",http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count{job="observability-sample-app"}[5m]))
        - alert: SampleAppHighErrorRate
          expr: sampleapp:http_requests:error_rate5m > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "observability-sample-app 5xx error rate above 5%"
            description: "{{ $value | humanizePercentage }} of requests to observability-sample-app have returned 5xx over the last 5 minutes."
        - alert: SampleAppCriticalErrorRate
          expr: sampleapp:http_requests:error_rate5m > 0.20
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "observability-sample-app 5xx error rate above 20% (SLO burn)"
            description: "{{ $value | humanizePercentage }} of requests to observability-sample-app have returned 5xx over the last 5 minutes — burning error budget fast."
