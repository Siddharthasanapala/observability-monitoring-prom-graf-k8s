# Kubernetes object-state alerts, sourced from kube-state-metrics — deployment/statefulset
# health, pod scheduling, and image-pull failures. Complements pod-crashloops.yaml (which
# watches restart counts specifically) with the broader "is the workload's desired state
# actually being met" question. Same `release: kube-prometheus-stack` label convention.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-workloads
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes-workloads
      rules:
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} not at desired replica count"
            description: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has not reached its desired replica count for 15 minutes — check for scheduling or image-pull failures."

        - alert: StatefulSetReplicasMismatch
          expr: |
            kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "StatefulSet {{ $labels.statefulset }} in {{ $labels.namespace }} not fully ready"
            description: "StatefulSet {{ $labels.statefulset }} in {{ $labels.namespace }} has had a ready-replica mismatch for 15 minutes."

        - alert: PodStuckPending
          expr: |
            sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} stuck Pending"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been Pending for 15 minutes — likely insufficient node capacity or an unschedulable constraint."

        - alert: PodImagePullBackOff
          expr: |
            kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} in {{ $labels.namespace }} cannot pull its image"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} ({{ $labels.namespace }}) has been in ImagePullBackOff for 5 minutes."

        - alert: JobFailed
          expr: |
            kube_job_status_failed > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.job_name }} in {{ $labels.namespace }} has failed"
            description: "Job {{ $labels.job_name }} in namespace {{ $labels.namespace }} reports at least one failed pod."

        - alert: HPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} in {{ $labels.namespace }} pinned at max replicas"
            description: "HorizontalPodAutoscaler {{ $labels.horizontalpodautoscaler }} in {{ $labels.namespace }} has been at its max replica ceiling for 15 minutes — consider raising the ceiling or investigating the load."
