# Phase 4 NetworkPolicy — default-deny with explicit allows for scrape/query/ingest traffic.
# Port numbers (3000 Grafana, 9090 Prometheus, 9093 Alertmanager) are the well-known defaults
# for kube-prometheus-stack (Phase 5). If Phase 5's Helm values change them, these must be updated.
# podSelector: {} is used deliberately (matches all pods in the namespace) rather than guessing
# exact chart-generated pod labels before Phase 5 exists — namespace boundaries are the primary
# control here; tighten to specific pod labels once the real chart is deployed if needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Found via a real failed deployment (Phase 5 kube-prometheus-stack's admission-create hook
# timed out reaching the API server): default-deny-all blocks egress to the Kubernetes API
# server itself unless explicitly allowed. Many workloads need this (operator hooks,
# Promtail's Kubernetes service discovery in Phase 6, etc.), so it's a baseline rule here.
#
# Empirically debugged (this was NOT a one-line guess): targeting the `kubernetes.default.svc`
# ClusterIP (10.96.0.1/32) via ipBlock silently timed out even though the rule looked correct;
# targeting the kube-apiserver Pod via podSelector/namespaceSelector *also* timed out, because
# kube-apiserver runs with hostNetwork: true (it's not on the pod overlay network at all).
# Root cause: kube-proxy DNATs ClusterIP -> node IP *before* Calico evaluates egress policy on
# this cluster, so the ipBlock must target the post-DNAT node IP. Confirmed by testing directly
# against the node IP, which succeeded. 192.168.49.2 is this Minikube node's InternalIP
# (`kubectl get nodes -o wide`) — this is environment-specific and WILL be wrong after any
# cluster rebuild with a different Docker network, and does not translate to GKE/EKS at all
# (their control planes aren't cluster nodes/pods) — must be redesigned in Phases 12-13.
#
# Same root cause hit Prometheus's own ServiceMonitor scrape targets: node-exporter (port
# 9100, moved to kube-system in Phase 5 for PSS reasons) and kubelet (port 10250, /metrics +
# /metrics/cadvisor + /metrics/probes) both run hostNetwork: true, so they needed the same
# node-IP treatment — found by checking `curl` from a live pod timed out on both ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-metrics-egress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.49.2/32
      ports:
        - {protocol: TCP, port: 8443}   # kube-apiserver
        - {protocol: TCP, port: 9100}   # node-exporter
        - {protocol: TCP, port: 10250}  # kubelet (/metrics, /metrics/cadvisor, /metrics/probes)
        - {protocol: TCP, port: 10249}  # kube-proxy (binds 0.0.0.0, genuinely reachable — unlike
                                         # scheduler/controller-manager/etcd below, which Minikube
                                         # hardcodes to 127.0.0.1 and no NetworkPolicy can reach)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from: [{podSelector: {}}]
  egress:
    - to: [{podSelector: {}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-ingress-from-ingress-nginx
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 3000}  # Grafana
        - {protocol: TCP, port: 9090}  # Prometheus (direct UI access, optional)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrape-egress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              observability.io/tenant: platform-team   # logging, tracing
        - namespaceSelector:
            matchLabels:
              observability.io/tenant: app-team         # demo-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system  # node/kubelet metrics
