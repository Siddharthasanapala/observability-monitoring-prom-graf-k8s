# Phase 5 — kube-prometheus-stack (Prometheus + Grafana + Alertmanager), HA + persistent.
# Chart: prometheus-community/kube-prometheus-stack, pinned to 87.15.2 (see
# argocd-apps/kube-prometheus-stack.yaml). Deployed into the `observability` namespace,
# which enforces `restricted` Pod Security Standard (Phase 4).
#
# PSS note: Prometheus/Alertmanager pod specs are generated by prometheus-operator from the
# Prometheus/Alertmanager CRDs. Their chart defaults set pod-level securityContext
# (runAsNonRoot, seccompProfile) but do not set the container-level
# allowPrivilegeEscalation/capabilities.drop fields `restricted` PSS requires explicitly —
# checked against the chart's own default values, then patched in below via `containers:`
# overrides (a documented prometheus-operator CRD mechanism for patching generated
# containers by name). Grafana and kube-state-metrics chart defaults are already fully
# `restricted`-compliant out of the box and need no changes. node-exporter needs
# hostNetwork/hostPID/hostPath (flatly incompatible with `restricted`), so its pods are
# moved out of this namespace into kube-system via namespaceOverride, exactly as flagged
# as a known conflict when the namespace PSS labels were added in Phase 4.
#
# Resource sizing note: found via live deployment that the chart sets NO default
# requests/limits on most containers, so every container (including tiny sidecars like the
# config-reloader) was falling back to the observability namespace's LimitRange default of
# 500m CPU each (Phase 3) — with 2 Prometheus + 3 Alertmanager replicas each running 2
# containers, that alone exceeded the namespace's 3-CPU ResourceQuota limit and blocked
# alertmanager-1 from scheduling. Fix: explicit, right-sized resources per component below
# (real requirements, not the LimitRange default) — this comfortably fits the existing
# Phase 3 quota without needing to raise it.
#
# Second live-deployment finding: the observability LimitRange (Phase 3) also sets a *minimum*
# of 50m CPU / 64Mi memory per container, not just a default ceiling — my first pass sized the
# small sidecars (config-reloader, kube-state-metrics, grafana sidecars) below that floor and
# every one of them was rejected at pod-creation time. Every request/limit below is >= 50m/64Mi.
#
# Third live-deployment finding: checked the actual static pod flags (`kubectl get pod
# kube-scheduler-minikube -n kube-system -o yaml`) — Minikube hardcodes kube-scheduler and
# kube-controller-manager to --bind-address=127.0.0.1, and etcd to
# --listen-metrics-urls=http://127.0.0.1:2381. These are unreachable from any pod on any
# network configuration, not a NetworkPolicy gap — disabled below rather than left as
# permanently-failing Prometheus targets. kube-proxy (metricsBindAddress: 0.0.0.0:10249) IS
# genuinely reachable and stays enabled (see manifests/network-policies/observability.yaml).
# On a real GKE/EKS cluster the control plane isn't part of the node pool at all, so these
# ServiceMonitors are Minikube-self-hosted-control-plane-specific either way — revisit for
# Phases 12-13 rather than assuming this toggle carries over.
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false

fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 10d
    resources:
      requests: {cpu: 300m, memory: 400Mi}
      limits: {cpu: 700m, memory: 700Mi}
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: prometheus
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 4Gi
    # podAntiAffinity: "soft" is already the chart default (spreads replicas across nodes
    # where possible; a no-op on single-node Minikube, becomes real on multi-node GKE/EKS).

alertmanager:
  alertmanagerSpec:
    replicas: 3   # odd number for gossip-protocol quorum, not 2 — 2 replicas gives no real HA advantage
    # Email routing: watch for AlertmanagerConfig objects labeled alertmanagerConfig: email,
    # in any namespace — lets routing/receiver config live as its own GitOps-managed object
    # (manifests/alert-rules/email-routing.yaml) instead of being embedded in this values file,
    # so the SMTP auth password (referenced via a Secret, never inlined) never has to touch Git.
    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: email
    alertmanagerConfigNamespaceSelector: {}
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containers:
      - name: alertmanager
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

grafana:
  persistence:
    enabled: true
    type: pvc
    storageClassName: standard
    accessModes: ["ReadWriteOnce"]
    size: 2Gi
  # Found via live deployment: Grafana's default initChownData init container runs as root
  # with CHOWN/DAC_OVERRIDE to fix PVC ownership — rejected outright by `restricted` PSS.
  # It's redundant anyway: grafana.securityContext.fsGroup (472, chart default) already makes
  # the mounted volume group-writable without needing root, so the init container is disabled.
  initChownData:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 300m, memory: 256Mi}
  sidecar:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
    datasources:
      enabled: true
      defaultDatasourceEnabled: true   # auto-provisions the in-cluster Prometheus datasource
  # Admin credentials intentionally NOT set here — the chart auto-generates a random
  # `kube-prometheus-stack-grafana` Secret (key: admin-password), same "don't put secrets
  # in git" principle as ArgoCD's own initial-admin-secret pattern (Phase 2).
  # Phase 6: Loki datasource, extending this same provisioning mechanism. Loki's fullnameOverride
  # is "loki" (manifests/loki/values.yaml), deployed in the `logging` namespace — cross-namespace
  # FQDN required, same reasoning as Promtail's client URL. Explicit `uid: loki` (chart's own
  # Prometheus datasource similarly pins `uid: prometheus`) so Phase 7's Tempo datasource can
  # reference it by a known, stable ID for trace-to-logs correlation instead of Grafana's
  # otherwise-random auto-generated UID.
  #
  # Phase 7: Tempo datasource, same pattern, `uid: tempo`. jsonData wires the standard Grafana
  # trace<->logs/metrics correlation: tracesToLogsV2 (jump from a span to its Loki logs, filtered
  # by the "namespace"/"pod" labels Promtail already attaches), tracesToMetrics + serviceMap
  # (jump from a span to Prometheus — service-graph metrics aren't emitted by anything yet since
  # Tempo's metrics-generator isn't enabled in tempo/values.yaml, so these panels stay empty
  # until/unless that's turned on later; the wiring itself is still correct and harmless without it).
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
      isDefault: false
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.tracing.svc.cluster.local:3200
      isDefault: false
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1h"
          spanEndTimeShift: "1h"
          tags: ["namespace", "pod"]
          filterByTraceID: false
          filterBySpanID: false
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
        lokiSearch:
          datasourceUid: loki

kube-state-metrics:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 100m, memory: 128Mi}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 200m, memory: 128Mi}
  prometheusConfigReloader:
    # shared config-reloader sidecar resources for both Prometheus and Alertmanager pods
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}

prometheus-node-exporter:
  namespaceOverride: kube-system
