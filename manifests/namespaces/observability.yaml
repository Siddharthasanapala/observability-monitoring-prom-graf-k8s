# Namespace sizing rationale (Phase 3):
# Cluster budget is 4 CPU / 8192Mi (Phase 1). ~1 CPU / ~1.5Gi is reserved outside these
# quotas for kube-system, ingress-nginx, and argocd. The remaining ~3 CPU / ~6.5Gi is
# split across the four tenant namespaces below, weighted toward `observability` since
# Phase 5 deploys HA Prometheus + Grafana + Alertmanager here (the heaviest workload).
#
# Phase 4: `restricted` Pod Security Standard enforced via namespace labels below.
# KNOWN FRICTION FOR PHASE 5: kube-prometheus-stack's node-exporter DaemonSet needs
# hostNetwork/hostPID/hostPath (to read host /proc,/sys) which `restricted` forbids
# outright. When Phase 5 lands, node-exporter will need to run in a separate,
# less-restricted namespace (e.g. kube-system) — it cannot run inside `observability`
# as labeled here. Flagging now so it isn't a surprise mid-Phase-5.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: observability-platform
    observability.io/component: metrics
    observability.io/tenant: platform-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-quota
  namespace: observability
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "3"
    limits.memory: 6Gi
    persistentvolumeclaims: "10"
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: observability-limits
  namespace: observability
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 4Gi
