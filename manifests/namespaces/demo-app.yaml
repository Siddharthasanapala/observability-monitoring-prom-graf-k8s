# Phase 4: `restricted` Pod Security Standard enforced via namespace labels below.
# The Phase 8 ASP.NET Core app already plans a non-root Dockerfile, so it should already
# be `restricted`-compliant by design — this just makes that a cluster-enforced guarantee.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/part-of: observability-platform
    observability.io/component: sample-workload
    observability.io/tenant: app-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-app-quota
  namespace: demo-app
spec:
  hard:
    requests.cpu: "250m"
    requests.memory: 256Mi
    limits.cpu: "500m"
    limits.memory: 512Mi
    persistentvolumeclaims: "2"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-app-limits
  namespace: demo-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: 250m
        memory: 256Mi
