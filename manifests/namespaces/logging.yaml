# Phase 4: `restricted` Pod Security Standard enforced via namespace labels below.
# KNOWN FRICTION FOR PHASE 6: Promtail's DaemonSet needs hostPath mounts (/var/log/pods,
# container runtime log dirs) to tail node logs, which `restricted` forbids. Loki itself
# (no host access needed) is fine under `restricted`; Promtail will need a namespace
# exception or a hostPath-tolerant PSS level when Phase 6 lands.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    app.kubernetes.io/part-of: observability-platform
    observability.io/component: logs
    observability.io/tenant: platform-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: logging-quota
  namespace: logging
spec:
  hard:
    requests.cpu: "750m"
    requests.memory: 1Gi
    limits.cpu: "1500m"
    limits.memory: 2Gi
    persistentvolumeclaims: "5"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: logging-limits
  namespace: logging
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 1Gi
