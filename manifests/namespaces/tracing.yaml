# Phase 4: `restricted` Pod Security Standard enforced via namespace labels below.
# Tempo and the OTel Collector need no host access, so both should run cleanly under
# `restricted` — no known friction here, unlike observability/logging's node-level agents.
#
# Phase 9 fix: Tempo was found OOMKilling repeatedly at its original 512Mi limit under real
# alert-testing traffic (WAL replay on restart appears to spike well above steady-state usage).
# Bumped quota ceiling and LimitRange max together so Tempo's own values.yaml sizing bump has
# room to fit — see manifests/tempo/values.yaml for the container-level change.
apiVersion: v1
kind: Namespace
metadata:
  name: tracing
  labels:
    app.kubernetes.io/part-of: observability-platform
    observability.io/component: traces
    observability.io/tenant: platform-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tracing-quota
  namespace: tracing
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 1Gi
    limits.cpu: "1"
    limits.memory: 2Gi
    persistentvolumeclaims: "3"
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tracing-limits
  namespace: tracing
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: 500m
        memory: 1536Mi
