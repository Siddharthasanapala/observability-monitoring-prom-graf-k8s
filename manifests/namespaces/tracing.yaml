# Phase 4: `restricted` Pod Security Standard enforced via namespace labels below.
# Tempo and the OTel Collector need no host access, so both should run cleanly under
# `restricted` — no known friction here, unlike observability/logging's node-level agents.
apiVersion: v1
kind: Namespace
metadata:
  name: tracing
  labels:
    app.kubernetes.io/part-of: observability-platform
    observability.io/component: traces
    observability.io/tenant: platform-team
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tracing-quota
  namespace: tracing
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 768Mi
    limits.cpu: "1"
    limits.memory: 1536Mi
    persistentvolumeclaims: "3"
    pods: "15"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tracing-limits
  namespace: tracing
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: 500m
        memory: 768Mi
