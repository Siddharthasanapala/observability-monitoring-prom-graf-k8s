# Helm-based flow — cert-manager, GitOps-managed via bootstrap/root-app-helmbased.yaml.
# Unlike argocd-apps/cert-manager.yaml (which deploys the vendored manifests/cert-manager/
# YAML), this pulls the official Helm chart straight from the jetstack repo — genuinely
# "Helm-based," matching what scripts/setup-minikube-helm.sh installed via plain
# `helm install` before this flow was moved onto ArgoCD. Pinned to v1.21.1, the version
# actually installed and tested (jetstack's chart version == its appVersion).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      valuesObject:
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # cert-manager's CRDs exceed the last-applied-configuration annotation size limit under a normal apply
