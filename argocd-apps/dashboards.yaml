# Phase 9 — dashboards, GitOps-managed. Kustomize source (not plain directory) since
# manifests/dashboards/ uses a configMapGenerator to wrap the raw dashboard JSON.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Siddharthasanapala/observability-monitoring-prom-graf-k8s.git
    targetRevision: siddhu
    path: manifests/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
