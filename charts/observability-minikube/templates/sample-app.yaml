# The reference workload — proves the pipeline end-to-end (metrics, logs, traces all sent by
# one real application). ServiceMonitor requires the Prometheus Operator CRDs to already
# exist, same ordering constraint as alert-rules.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-sample-app
  namespace: demo-app
  labels: {app.kubernetes.io/name: observability-sample-app}
spec:
  replicas: {{ .Values.sampleApp.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: observability-sample-app}
  template:
    metadata:
      labels: {app.kubernetes.io/name: observability-sample-app}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sample-app
          image: "{{ .Values.sampleApp.image.repository }}:{{ .Values.sampleApp.image.tag }}"
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: OTEL_SERVICE_NAME, value: observability-sample-app}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector-opentelemetry-collector.tracing.svc.cluster.local:4317"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          livenessProbe:  {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: observability-sample-app
  namespace: demo-app
  labels: {app.kubernetes.io/name: observability-sample-app}
spec:
  selector: {app.kubernetes.io/name: observability-sample-app}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: observability-sample-app
  namespace: demo-app
  labels:
    app.kubernetes.io/name: observability-sample-app
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: observability-sample-app}
  endpoints:
    - {port: http, path: /metrics, interval: 15s}
